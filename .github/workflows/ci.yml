name: CI

on:
  push:
    branches: [main, codex/buzz-openconfig-routing]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openconfig-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-test-suite:
    name: macOS test suite
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify repository signature
        run: ./signature.sh
      - name: Run complete OpenConfig test suite
        env:
          NO_COLOR: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./oc test
